<!-- highlight.js VBA 精确高亮 + 复制按钮（ligy118 自定义，本地资源） -->
<script src="/assets/js/highlight.min.js"></script>
<script src="/assets/js/highlightjs-vba.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var blocks = document.querySelectorAll('code.language-vba');
    for (var i = 0; i < blocks.length; i++) {
      var code = blocks[i];
      hljs.highlightElement(code);
      wrapWithHeader(code);
    }
  });
  function wrapWithHeader(code) {
    var pre = code.parentNode;
    if (!pre || pre.tagName !== 'PRE') return;
    if (pre.previousElementSibling && pre.previousElementSibling.classList.contains('code-header')) return;
    var wrapper = document.createElement('div');
    wrapper.className = 'language-vba highlighter-rouge';
    var header = document.createElement('div');
    header.className = 'code-header';
    var label = document.createElement('span');
    label.className = 'language-label';
    label.textContent = 'VBA';
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('aria-label', 'copy');
    btn.setAttribute('data-title-succeed', '已复制！');
    btn.innerHTML = '<i class="far fa-clipboard"></i>';
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      var text = code.innerText || code.textContent;
      var done = function () { btn.innerHTML = '<i class="fas fa-check"></i>'; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { done(); });
      } else {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (err) {}
        document.body.removeChild(ta); done();
      }
      setTimeout(function () { btn.innerHTML = '<i class="far fa-clipboard"></i>'; }, 1500);
    });
    header.appendChild(label);
    header.appendChild(btn);
    wrapper.appendChild(header);
    pre.parentNode.insertBefore(wrapper, pre);
    wrapper.appendChild(pre);
  }
</script>
